[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "reality-layer"
version = "0.1.0"
description = "Verified, permission-aware world state and action control plane for AI agents."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115",
  "pydantic-settings>=2.5",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
]

[project.scripts]
reality = "reality_layer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/reality_layer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/reality_layer"]
mypy_path = "src"
