# Railway service configuration for the Reality Layer API.
#
# This file configures the *web* service. The verifier is a second Railway
# service deployed from the same repo/image with its start command overridden to
# `reality verify` in the service settings (see docs/deployment-railway.md).

[build]
# Nixpacks is no longer a selectable Railway builder; the repo ships a Dockerfile
# that installs the package so `reality` / `alembic` are on PATH.
builder = "DOCKERFILE"

[deploy]
startCommand = "reality serve --host 0.0.0.0 --port $PORT"
# Apply database migrations before each new release starts taking traffic.
preDeployCommand = "alembic upgrade head"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
