# Railway service configuration for the Reality Layer API.
#
# This file configures the *web* service. The verifier is a second Railway
# service deployed from the same repo with its start command overridden to
# `reality verify` (see docs/deployment-railway.md).

[build]
builder = "nixpacks"

# Install the package itself (not just its dependencies) so the `reality` entry
# point is on PATH and `reality_layer` is importable by alembic/env.py.
[build.nixpacksPlan.phases.install]
cmds = ["python -m pip install --upgrade pip", "python -m pip install ."]

[deploy]
startCommand = "reality serve --host 0.0.0.0 --port $PORT"
# Apply database migrations before each new release starts taking traffic.
preDeployCommand = "alembic upgrade head"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
